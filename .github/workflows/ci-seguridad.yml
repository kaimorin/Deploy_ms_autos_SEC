name: Spring Boot CI/CD Seguro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Análisis de seguridad de dependencias (SCA) con Snyk
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Fix mvnw permissions
        run: if [ -f mvnw ]; then chmod +x mvnw; fi

      - name: Resolve Maven dependencies
        run: mvn -B install -DskipTests

      - name: Snyk test Java dependencies
        run: |
          snyk test --severity-threshold=high \
            --file=pom.xml \
            --json-file-output=snyk-report.json -d

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: ms-vehiculos/snyk-report.json

  # 2. Pruebas unitarias y cobertura con JaCoCo
  test:
    name: Run Tests with JaCoCo
    runs-on: ubuntu-latest
    needs: snyk-scan
    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Build and test
        run: mvn -B clean verify

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ms-vehiculos/target/site/jacoco/

  # 3. Análisis de calidad y seguridad del código (SAST) con SonarCloud
  sonar-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=kaimorin_Deploy_ms_autos_SEC \
            -Dsonar.organization=kaimorin \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN}

  # 4. Empaquetado del archivo JAR
  build-jar:
    name: Build Jar
    runs-on: ubuntu-latest
    needs: sonar-analysis
    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Package application
        run: mvn -B clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ms-vehiculos/target/*.jar

  # 5. Construir Imagen, Publicar en GHCR y Desplegar en EC2
  docker-build-and-deploy:
    name: Build, Push & Deploy Container
    runs-on: ubuntu-latest
    needs: build-jar
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ms-vehiculos
          push: true
          tags: |
            ghcr.io/kaimorin/ms-vehiculos:latest
            ghcr.io/kaimorin/ms-vehiculos:${{ github.sha }}

      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/app
            cd ~/app
            curl -sSL https://raw.githubusercontent.com/kaimorin/Deploy_ms_autos_SEC/main/docker-compose.yml -o docker-compose.yml
            docker compose pull
            docker compose up -d
            docker compose ps